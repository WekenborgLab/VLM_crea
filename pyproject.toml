[project]
name = "vlm-crea"
version = "1.0.0"
description = "Async VLM image evaluation pipeline: structured per-category presence/confidence ratings with token tracking and streaming CSV outputs."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  "python-dotenv>=1.2.1",
  "openai>=2.7.2",
  "pillow>=12.0.0",
  "pandas>=2.3.3",
  "openpyxl>=3.1.5",
  "tqdm>=4.67.1",
]

# Optional, auto-detected at runtime if present in the environment:
#   imageio -> fallback decoder for malformed image files
#   pyvips  -> low-memory streaming decode/resize
# Neither was installed for the reported runs.
